[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maatr"
version = "0.1.0"
description = "Bring order to the chaos of media files."
requires-python = ">=3.11"  # tomllib
dependencies = [
    "click",
    "guessit",
    # The review list puts the current name in front of the cursor to be
    # edited. macOS' stdlib readline is libedit, which ignores the startup
    # hook that does it, so the real GNU readline is pulled in there.
    "gnureadline; sys_platform == 'darwin'",
]

[project.scripts]
maatr = "maatr:cli"
mtr = "maatr:cli"

[tool.setuptools]
# Only maatr.py is the package; test_audio_rules.py stays out of the wheel.
py-modules = ["maatr"]
